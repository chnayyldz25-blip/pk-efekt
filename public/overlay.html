<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PK Efekt · Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;800&display=swap">
<style>
  :root{ --dur:4200ms; }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:"Anton",Impact,"Arial Black",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

  #stage{position:fixed;left:50%;top:50%;width:1080px;height:1920px;transform:translate(-50%,-50%);pointer-events:none;will-change:transform}
  #shake{position:absolute;inset:0;will-change:transform}
  #fx{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #bg{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:fill;opacity:0;background:transparent}
  #bg.on{opacity:1}

  .t-fire {--c1:#fff6d5;--c2:#ffd34d;--c3:#ff7a1a;--c4:#5a1500;--glow:rgba(255,120,30,.75);--rule:#ffb347}
  .t-gold {--c1:#fff3c4;--c2:#f5c842;--c3:#c9901a;--c4:#7a4f06;--glow:rgba(255,220,120,.55);--rule:#f5c842}
  .t-neon {--c1:#f0e6ff;--c2:#c56bff;--c3:#7a2cff;--c4:#2a0a5e;--glow:rgba(197,107,255,.6);--rule:#c56bff}
  .t-ice  {--c1:#f2fbff;--c2:#8fd8ff;--c3:#2a9be0;--c4:#0a3a66;--glow:rgba(143,216,255,.6);--rule:#8fd8ff}

  .wrap{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%) scale(3);opacity:0;
        display:flex;flex-direction:column;align-items:center;width:640px;will-change:transform,opacity}
  .m3d{position:relative;perspective:1400px;transform-style:preserve-3d;will-change:transform}
  #txt{display:block;will-change:transform}
  #shn{position:absolute;left:0;top:0;pointer-events:none;overflow:hidden;opacity:0;
        -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  #band{position:absolute;top:-10%;left:0;height:120%;width:320px;will-change:transform;
        background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 100%)}
  /* float: slow 3D sway during the hold */
  .play .m3d{animation:sway 3.2s 900ms ease-in-out infinite}
  @keyframes sway{
    0%{transform:rotateY(-16deg) rotateX(7deg) translateY(0)}
    50%{transform:rotateY(16deg) rotateX(-5deg) translateY(-10px)}
    100%{transform:rotateY(-16deg) rotateX(7deg) translateY(0)}}
  .name{margin-top:14px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:84px;letter-spacing:.14em;
        color:var(--c1);text-shadow:0 0 3px #140400,0 0 3px #140400,0 3px 0 var(--c4),0 9px 0 #1a0800,0 0 14px rgba(15,3,0,1),0 0 24px rgba(15,3,0,.95),0 0 44px rgba(15,3,0,.85);
        padding:4px 34px;border-top:4px solid var(--rule);border-bottom:4px solid var(--rule)}

  .play .wrap{animation:slam var(--dur) cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes slam{
    0%,6%{opacity:0;transform:translate(-50%,-50%) scale(3.2) rotate(-5deg)}
    12%{opacity:1;transform:translate(-50%,-50%) scale(.9) rotate(1deg)}
    15%{transform:translate(-50%,-50%) scale(1.07) rotate(-.4deg)}
    18%{transform:translate(-50%,-50%) scale(1)}
    82%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-56%) scale(1.1)}
  }
  .play #shake{animation:shake 700ms 330ms linear}
  @keyframes shake{
    0%{transform:translate(0,0)}10%{transform:translate(-14px,9px)}20%{transform:translate(12px,-7px)}30%{transform:translate(-9px,6px)}
    40%{transform:translate(7px,-5px)}55%{transform:translate(-4px,3px)}70%{transform:translate(2px,-2px)}100%{transform:translate(0,0)}}

  #dot{position:fixed;right:10px;bottom:10px;width:10px;height:10px;border-radius:50%;display:none;background:#e33}
  #dot.on{background:#3c3}
  #panel{position:fixed;left:16px;bottom:16px;display:none;gap:10px;pointer-events:auto;font-family:system-ui,sans-serif}
  #panel button{font:600 15px system-ui;padding:12px 18px;border:0;border-radius:10px;background:#fff;color:#111;cursor:pointer}
  #panel span{color:#fff;font-size:13px;opacity:.75;align-self:center;text-shadow:0 1px 2px #000}
  body.test #panel{display:flex} body.test #dot{display:block}
</style>
</head>
<body class="t-fire">
<div id="stage">
  <video id="bg" muted playsinline preload="auto"></video>
  <div id="shake">
  <canvas id="fx" width="540" height="960"></canvas>
  <div class="wrap">
    <div class="m3d" id="m3d"><canvas id="txt"></canvas><div id="shn"><div id="band"></div></div></div>
    <div class="name" id="name">YAYINCI</div>
  </div>
</div></div>
<div id="dot" class="off"></div>
<div id="panel"><button id="btn">Efekti oynat</button><span>T tuşu da çalışır · <b id="mode"></b> · <b id="fps"></b> <b id="vfps"></b></span></div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var name = (q.get("name") || "YAYINCI").toUpperCase().slice(0,16);
  var mult = (q.get("mult") || "3").replace(/[^0-9]/g,"") || "3";
  var theme = q.get("theme") || "fire";
  var DUR = 4200;
  var hashTest = /test/.test(location.hash);
  var testMode = q.get("test") === "1" || hashTest;

  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), cv = $("fx"), ctx = cv.getContext("2d", { alpha:true });
  var W = 540, H = 960, CX = 270, CY = 576;

  var COL = {
    fire:{c1:"#fff6d5",c2:"#ffd34d",c3:"#ff7a1a",glow:"rgba(255,120,30,.75)",d:["#7a2a00","#2a0a00"]},
    gold:{c1:"#fff3c4",c2:"#f5c842",c3:"#c9901a",glow:"rgba(255,220,120,.55)",d:["#8a5a08","#2a1a02"]},
    neon:{c1:"#f0e6ff",c2:"#c56bff",c3:"#7a2cff",glow:"rgba(197,107,255,.6)",d:["#3a1270","#120530"]},
    ice: {c1:"#f2fbff",c2:"#8fd8ff",c3:"#2a9be0",glow:"rgba(143,216,255,.6)",d:["#0e4a80","#041a30"]}
  };
  function mix(a,b,t){ var pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16), r=[16,8,0].map(function(sh){ var x=(pa>>sh)&255, y=(pb>>sh)&255; return Math.round(x+(y-x)*t); }); return "rgb("+r.join(",")+")"; }
  var curMult = mult, textTheme = theme, maskC = document.createElement("canvas"), TXT = { w:0, h:0 };
  var FONT = "Anton, Impact, 'Arial Black', sans-serif";
  function drawText(){
    var C = COL[textTheme] || COL.fire, F = 440, FX = 242, pad = 80, gap = 10, lift = 77;
    var tc = $("txt"), t = tc.getContext("2d");
    t.font = F + "px " + FONT; var mN = t.measureText(curMult), wN = mN.width, asc = mN.actualBoundingBoxAscent || F*.75;
    t.font = FX + "px " + FONT; var wX = t.measureText("X").width;
    var cw = Math.ceil(wX + gap + wN + pad*2 + 30), ch = Math.ceil(asc + pad*2 + 50), y = pad + asc;
    tc.width = cw; tc.height = ch; maskC.width = cw; maskC.height = ch;
    var sh = $("shn"); sh.style.width = cw + "px"; sh.style.height = ch + "px";
    function glyphs(c, dx, dy){ c.font = FX + "px " + FONT; c.fillText("X", pad + dx, y - lift + dy); c.font = F + "px " + FONT; c.fillText(curMult, pad + wX + gap + dx, y + dy); }
    t = tc.getContext("2d"); t.clearRect(0,0,cw,ch); t.textBaseline = "alphabetic";
    // dark halo: keeps the number readable over a white-hot fireball or a bright camera
    t.save(); t.fillStyle = "rgba(20,5,0,.9)"; t.shadowColor = "rgba(10,2,0,.95)"; t.shadowBlur = 46;
    glyphs(t, 8, 12); glyphs(t, 8, 12); t.shadowBlur = 18; glyphs(t, 6, 10); t.restore();
    t.save(); t.lineJoin = "round"; t.strokeStyle = "rgba(25,6,0,.95)"; t.lineWidth = 14;
    t.font = FX + "px " + FONT; t.strokeText("X", pad, y - lift); t.font = F + "px " + FONT; t.strokeText(curMult, pad + wX + gap, y); t.restore();
    for (var i=18;i>=1;i--){ t.fillStyle = mix(C.d[0], C.d[1], i/18); glyphs(t, i*1.6, i*2.7); }      // extrusion
    var g = t.createLinearGradient(0, y-asc, 0, y); g.addColorStop(0,C.c1); g.addColorStop(.36,C.c2); g.addColorStop(.64,C.c3); g.addColorStop(1,C.c1);
    t.save(); t.shadowColor = C.glow; t.shadowBlur = 42; t.fillStyle = g; glyphs(t,0,0); t.restore();        // glow
    t.fillStyle = g; glyphs(t,0,0);                                                                       // face
    var m = maskC.getContext("2d"); m.clearRect(0,0,cw,ch); m.fillStyle = "#fff"; glyphs(m,0,0);          // shine mask
    var mu = "url(" + maskC.toDataURL("image/png") + ")"; sh.style.webkitMaskImage = mu; sh.style.maskImage = mu;
    // keep the old layout: visible glyph box sits where the HTML text used to be
    tc.style.margin = (-pad) + "px " + (-pad) + "px " + (-(ch - y - 44)) + "px";
    $("shn").style.left = "0px"; $("shn").style.top = (-pad) + "px"; $("shn").style.marginLeft = (-pad) + "px";
    TXT.w = cw; TXT.h = ch;
  }
  function setText(n, m){ $("name").textContent = n; curMult = String(m); drawText(); }
  function buildDepth(t){ textTheme = t; drawText(); }
  function setTheme(t){ document.body.className = (testMode ? "test " : "") + "t-" + (t||"fire"); }
  setTheme(theme); setText(name, mult);
  if (document.fonts && document.fonts.load) document.fonts.load("440px Anton").then(drawText).catch(function(){});

  function fit(){ var s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = "translate(-50%,-50%) scale(" + s + ")"; }
  addEventListener("resize", fit); fit();

  // ---------- sprites (pre-rendered once) ----------
  function blob(size, stops){
    var c = document.createElement("canvas"); c.width = c.height = size;
    var g = c.getContext("2d"), r = size/2, gr = g.createRadialGradient(r,r,0,r,r,r);
    for (var i=0;i<stops.length;i++) gr.addColorStop(stops[i][0], stops[i][1]);
    g.fillStyle = gr; g.fillRect(0,0,size,size); return c;
  }
  var PAL = {
    fire:{ flame:[["0","rgba(255,250,210,1)"],[".25","rgba(255,200,70,.95)"],[".55","rgba(255,100,20,.55)"],["1","rgba(120,20,0,0)"]],
           ember:[["0","rgba(255,240,180,1)"],[".4","rgba(255,160,40,.9)"],["1","rgba(255,80,0,0)"]],
           smoke:[["0","rgba(40,12,4,.35)"],["1","rgba(20,6,2,0)"]], ring:"rgba(255,170,60,", wash:"rgba(255,90,20," },
    gold:{ flame:[["0","rgba(255,250,220,1)"],[".3","rgba(255,215,90,.9)"],[".6","rgba(220,150,30,.45)"],["1","rgba(120,80,0,0)"]],
           ember:[["0","rgba(255,245,200,1)"],[".4","rgba(245,200,66,.9)"],["1","rgba(200,140,20,0)"]],
           smoke:[["0","rgba(30,20,5,.25)"],["1","rgba(20,12,2,0)"]], ring:"rgba(245,200,66,", wash:"rgba(255,200,80," },
    neon:{ flame:[["0","rgba(245,230,255,1)"],[".3","rgba(197,107,255,.9)"],[".6","rgba(122,44,255,.5)"],["1","rgba(40,10,90,0)"]],
           ember:[["0","rgba(255,240,255,1)"],[".4","rgba(197,107,255,.9)"],["1","rgba(122,44,255,0)"]],
           smoke:[["0","rgba(20,5,40,.35)"],["1","rgba(10,2,20,0)"]], ring:"rgba(197,107,255,", wash:"rgba(150,60,255," },
    ice: { flame:[["0","rgba(240,252,255,1)"],[".3","rgba(143,216,255,.9)"],[".6","rgba(42,155,224,.5)"],["1","rgba(10,58,102,0)"]],
           ember:[["0","rgba(255,255,255,1)"],[".4","rgba(143,216,255,.9)"],["1","rgba(42,155,224,0)"]],
           smoke:[["0","rgba(10,30,50,.3)"],["1","rgba(5,15,30,0)"]], ring:"rgba(143,216,255,", wash:"rgba(100,190,255," }
  };
  var SPR = {};
  function buildSprites(t){ var p = PAL[t] || PAL.fire;
    var g = ctx.createLinearGradient(0,H,0,H*.62); g.addColorStop(0, p.wash + ".34)"); g.addColorStop(1, p.wash + "0)");
    var gl = ctx.createLinearGradient(0,0,90,0); gl.addColorStop(0, p.wash + ".18)"); gl.addColorStop(1, p.wash + "0)");
    var gr = ctx.createLinearGradient(W,0,W-90,0); gr.addColorStop(0, p.wash + ".18)"); gr.addColorStop(1, p.wash + "0)");
    SPR = { flame:blob(96,p.flame), ember:blob(24,p.ember), smoke:blob(140,p.smoke), ring:p.ring, wash:p.wash, g:g, gl:gl, gr:gr }; }
  buildSprites(theme);

  // ---------- particles ----------
  var flames = [], embers = [], sparks = [], smokes = [], ring = null;
  function rnd(a,b){ return a + Math.random()*(b-a); }
  function spawnFlame(){
    // bottom band: strong but short-lived; sides: thin licks that stay below the face line
    var side = Math.random(), x, y, vx = 0, vy, s, decay;
    if (side < .62){ x = rnd(-10,W+10); y = rnd(H-30, H+30); vy = -rnd(3,6.5); vx = rnd(-.5,.5); s = rnd(.7,1.6); decay = rnd(.02,.034); }
    else if (side < .81){ x = rnd(-24, 30); y = rnd(H*.42, H); vy = -rnd(2,4); vx = rnd(.1,.8); s = rnd(.5,1.1); decay = rnd(.024,.04); }
    else { x = rnd(W-30, W+24); y = rnd(H*.42, H); vy = -rnd(2,4); vx = -rnd(.1,.8); s = rnd(.5,1.1); decay = rnd(.024,.04); }
    flames.push({x:x,y:y,vx:vx,vy:vy,s:s,life:1,decay:decay,w:rnd(0,6.28)});
  }
  function spawnEmber(){ embers.push({x:rnd(0,W),y:rnd(H*.5,H+20),vx:rnd(-.5,.5),vy:-rnd(1.2,3.2),s:rnd(.35,1),life:1,decay:rnd(.004,.009),w:rnd(0,6.28)}); }
  function burst(){
    for (var i=0;i<140;i++){ var a = Math.random()*6.283, sp = rnd(4,13);
      sparks.push({x:CX,y:CY,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,s:rnd(.3,.9),life:1,decay:rnd(.012,.026),spark:i%3===0,rot:rnd(0,6.28)}); }
    for (var j=0;j<10;j++) smokes.push({x:CX+rnd(-120,120),y:CY+rnd(-40,80),vx:rnd(-.5,.5),vy:-rnd(.4,1.1),s:rnd(1,2.2),life:1,decay:rnd(.006,.01)});
    ring = {r:30,a:1};
  }

  // ---------- frame loop (runs only while playing) ----------
  var t0 = 0, raf = 0, playing = false, frames = 0, fpsT = 0, burstDone = false;
  function frame(now){
    var el = now - t0, k = el/DUR;
    var intensity = k < .08 ? k/.08 : k < .78 ? 1 : Math.max(0, 1-(k-.78)/.22);
    frames++; if (now - fpsT > 1000){ $("fps").textContent = "ekran " + frames + " fps"; frames = 0; fpsT = now; }

    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = intensity;
    ctx.fillStyle = SPR.g; ctx.fillRect(0,H*.62,W,H*.38);
    ctx.fillStyle = SPR.gl; ctx.fillRect(0,0,90,H);
    ctx.fillStyle = SPR.gr; ctx.fillRect(W-90,0,90,H);
    ctx.globalAlpha = 1;

    if (intensity > 0){ for (var s=0; s<Math.round(4.5*intensity); s++) spawnFlame(); if (Math.random() < .5*intensity) spawnEmber(); }
    if (k > .07 && !burstDone){ burst(); burstDone = true; }

    for (var i=smokes.length-1;i>=0;i--){ var m = smokes[i]; m.x+=m.vx; m.y+=m.vy; m.s+=.012; m.life-=m.decay;
      if (m.life<=0){ smokes.splice(i,1); continue; } ctx.globalAlpha = m.life*.8; var ms = 140*m.s; ctx.drawImage(SPR.smoke, m.x-ms/2, m.y-ms/2, ms, ms); }

    ctx.globalCompositeOperation = "lighter";
    for (i=flames.length-1;i>=0;i--){ var f = flames[i]; f.w+=.15; f.x+=f.vx+Math.sin(f.w)*.9; f.y+=f.vy; f.life-=f.decay; f.s*=.985;
      if (f.life<=0){ flames.splice(i,1); continue; } ctx.globalAlpha = Math.min(.85,f.life); var fs = 96*f.s; ctx.drawImage(SPR.flame, f.x-fs/2, f.y-fs/2, fs, fs); }
    for (i=embers.length-1;i>=0;i--){ var e = embers[i]; e.w+=.08; e.x+=e.vx+Math.sin(e.w)*.6; e.y+=e.vy; e.life-=e.decay;
      if (e.life<=0){ embers.splice(i,1); continue; } ctx.globalAlpha = e.life*(.6+.4*Math.sin(e.w*3)); var es = 24*e.s; ctx.drawImage(SPR.ember, e.x-es/2, e.y-es/2, es, es); }
    for (i=sparks.length-1;i>=0;i--){ var p = sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.22; p.vx*=.985; p.life-=p.decay;
      if (p.life<=0){ sparks.splice(i,1); continue; } ctx.globalAlpha = p.life;
      if (p.spark){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot+el*.01); ctx.fillStyle="#fff"; ctx.fillRect(-9*p.s,-1.2,18*p.s,2.4); ctx.fillRect(-1.2,-9*p.s,2.4,18*p.s); ctx.restore(); }
      else { var ps = 24*p.s*p.life; ctx.drawImage(SPR.ember, p.x-ps/2, p.y-ps/2, ps, ps); } }
    if (ring && ring.a > 0){ ctx.globalAlpha = ring.a*.9; ctx.strokeStyle = SPR.ring + "1)"; ctx.lineWidth = 10*ring.a;
      ctx.beginPath(); ctx.arc(CX,CY,ring.r,0,6.283); ctx.stroke(); ring.r += 16; ring.a -= .04; }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";

    if (el < DUR + 400) raf = requestAnimationFrame(frame);
    else { ctx.clearRect(0,0,W,H); flames=[]; embers=[]; sparks=[]; smokes=[]; ring=null; finish(); }
  }

  // ---------- video layer (preloaded into memory, never waits on network mid-stream) ----------
  var HD = q.get("q") === "hd";
  // each video only covers the area where its effect lives (box in 1080x1920 stage pixels) -> far less work per frame
  var BUILD = "9";   // bump on every update: forces browsers and Studio to fetch the new video instead of a cached copy
  var VIDEOS = { fire: { src: (HD ? "/fire-bg-hd.webm" : "/fire-bg.webm") + "?v=" + BUILD, box: [0, 612, 1080, 1080] } };
  if (q.get("vsrc")) VIDEOS.fire.src = q.get("vsrc");
  var forceCode = q.get("mode") === "code";
  var bg = $("bg"), vidReady = {}, vidUrl = {}, curTheme = theme;
  function preload(t){
    if (forceCode || !VIDEOS[t] || vidUrl[t]) return;
    fetch(VIDEOS[t].src).then(function(r){ if (!r.ok) throw 0; return r.blob(); })
      .then(function(b){ vidUrl[t] = URL.createObjectURL(b); if (t === curTheme) loadVid(t); })
      .catch(function(){ vidReady[t] = false; });
  }
  function loadVid(t){
    if (!vidUrl[t]) return;
    bg.oncanplaythrough = function(){ vidReady[t] = true; showMode(); };
    bg.onerror = function(){ vidReady[t] = false; showMode(); };
    var bx = VIDEOS[t].box; bg.style.left = bx[0]+"px"; bg.style.top = bx[1]+"px"; bg.style.width = bx[2]+"px"; bg.style.height = bx[3]+"px";
    bg.src = vidUrl[t]; bg.load();
  }
  function useVideo(){ return !forceCode && vidReady[curTheme] === true; }
  function showMode(){ $("mode").textContent = (useVideo() ? "VİDEO" : "KOD") + " · sürüm " + BUILD; }
  preload(theme); showMode();

  var shAnims = [];
  function shine(){
    shAnims.forEach(function(a){ try{ a.cancel(); }catch(e){} }); shAnims = [];
    var sh = $("shn"), band = $("band"), w = TXT.w;
    if (!sh.animate) return;                                   // very old engines: simply no shine, nothing breaks
    var x0 = -0.35*w - 160, x1 = 1.35*w - 160;
    shAnims.push(band.animate([
      { transform: "translateX(" + x0 + "px) skewX(-25deg)", offset: 0 },
      { transform: "translateX(" + x0 + "px) skewX(-25deg)", offset: .24 },
      { transform: "translateX(" + x1 + "px) skewX(-25deg)", offset: .52, easing: "ease-out" },
      { transform: "translateX(" + x1 + "px) skewX(-25deg)", offset: 1 }
    ], { duration: DUR, fill: "forwards" }));
    shAnims.push(sh.animate([
      { opacity: 0, offset: 0 }, { opacity: 0, offset: .22 }, { opacity: 1, offset: .26 },
      { opacity: 1, offset: .52 }, { opacity: 0, offset: .56 }, { opacity: 0, offset: 1 }
    ], { duration: DUR, fill: "forwards" }));
  }
  // test-mode meter: real screen fps + real video frames presented
  var mRaf = 0;
  function meter(){
    if (!testMode) return;
    var n = 0, vn = 0, last = performance.now();
    cancelAnimationFrame(mRaf);
    function tick(now){ n++; if (now - last >= 1000){ $("fps").textContent = "ekran " + n + " fps"; if (vn) $("vfps").textContent = "· video " + vn + " fps"; n = 0; vn = 0; last = now; } if (playing) mRaf = requestAnimationFrame(tick); }
    if (bg.requestVideoFrameCallback){ var vcb = function(){ vn++; if (playing) bg.requestVideoFrameCallback(vcb); }; bg.requestVideoFrameCallback(vcb); }
    mRaf = requestAnimationFrame(tick);
  }
  function startTextFx(){
    document.body.classList.remove("play"); void document.body.offsetWidth; document.body.classList.add("play"); shine();
  }
  function finish(){
    playing = false; document.body.classList.remove("play"); bg.classList.remove("on");
    try { bg.pause(); } catch(e){}
    $("fps").textContent = ""; $("vfps").textContent = "";
  }
  function playCode(){
    ring = null; burstDone = false; startTextFx();
    t0 = performance.now(); fpsT = t0; frames = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  function playVideo(){
    var started = false;
    function go(){ if (started) return; started = true; bg.classList.add("on"); startTextFx(); meter();
      // end when the video has really finished (slow PCs never cut the fire mid-way), with a hard cap
      var done = false; function end(){ if (done) return; done = true; finish(); }
      bg.onended = end; setTimeout(end, DUR + 2500); }
    bg.onplaying = go;
    try { bg.currentTime = 0; } catch(e){}
    var pr = bg.play();
    if (pr && pr.catch) pr.catch(function(){ if (!started){ vidReady[curTheme] = false; showMode(); playCode(); } });
    // safety: if the video hasn't started within 400 ms, never leave the screen empty
    setTimeout(function(){ if (!started){ started = true; vidReady[curTheme] = false; showMode(); playCode(); } }, 400);
  }

  function play(o){
    o = o || {};
    if (o.theme && o.theme !== curTheme){ curTheme = o.theme; setTheme(o.theme); buildSprites(o.theme); buildDepth(o.theme); preload(o.theme); loadVid(o.theme); showMode(); }
    if (o.mult || o.name) setText(o.name ? o.name.toUpperCase().slice(0,16) : $("name").textContent, o.mult || curMult);
    if (playing) return; playing = true;
    if (useVideo()) playVideo(); else playCode();
  }
  $("btn").addEventListener("click", function(){ play(); });
  addEventListener("keydown", function(e){ if ((e.key||"").toLowerCase()==="t") play(); });
  window.playEffect = play;
  if (q.get("auto") === "1" || hashTest) setTimeout(function(){ play(); }, 900);

  var key = (q.get("key") || "").toLowerCase(), dot = $("dot");
  function connect(){
    if (!key) return;
    var ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://") + location.host + "/ws?key=" + encodeURIComponent(key) + "&role=overlay");
    ws.onopen = function(){ dot.className = "on"; };
    ws.onmessage = function(ev){ var m; try{ m = JSON.parse(ev.data); }catch(e){ return; } if (m.type==="play") play({mult:m.mult, theme:m.theme, name:m.name||name}); };
    ws.onclose = function(){ dot.className = "off"; setTimeout(connect, 2000); };
    ws.onerror = function(){ try{ ws.close(); }catch(e){} };
  }
  connect();
  setTimeout(function(){ location.reload(); }, 3*60*60*1000);
})();
