<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PK Efekt · Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;800&display=swap">
<style>
  :root{
    --gold-1:#fff3c4; --gold-2:#f5c842; --gold-3:#c9901a; --gold-4:#7a4f06; --ink:#1a1000;
    --neon-1:#f0e6ff; --neon-2:#c56bff; --neon-3:#7a2cff; --neon-4:#2a0a5e;
    --ice-1:#f2fbff; --ice-2:#8fd8ff; --ice-3:#2a9be0; --ice-4:#0a3a66;
    --c1:var(--gold-1); --c2:var(--gold-2); --c3:var(--gold-3); --c4:var(--gold-4); --glow:rgba(255,220,120,.55);
    --dur:3500ms;
  }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font-family:"Anton",Impact,"Arial Black",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}

  /* 1080x1920 stage; PK-safe column in the middle */
  #stage{position:fixed;inset:0;width:1080px;height:1920px;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
  #fx{position:absolute;inset:0;width:100%;height:100%}

  .theme-neon{--c1:var(--neon-1);--c2:var(--neon-2);--c3:var(--neon-3);--c4:var(--neon-4);--glow:rgba(197,107,255,.6)}
  .theme-ice{--c1:var(--ice-1);--c2:var(--ice-2);--c3:var(--ice-3);--c4:var(--ice-4);--glow:rgba(143,216,255,.6)}

  /* ---- text block (sits in PK-safe middle column, below the face) ---- */
  .wrap{
    position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;opacity:0;
    width:560px;
  }
  .mult{
    font-size:420px;line-height:.9;letter-spacing:-.02em;
    background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 38%,var(--c3) 62%,var(--c1) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 0 var(--c4)) drop-shadow(0 14px 0 var(--ink)) drop-shadow(0 0 40px var(--glow));
    position:relative;
  }
  .mult .x{font-size:.55em;vertical-align:.32em;margin-right:.04em}
  .name{
    margin-top:18px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;
    font-size:80px;letter-spacing:.14em;color:var(--c1);
    text-shadow:0 3px 0 var(--c4),0 8px 0 var(--ink),0 0 24px var(--glow);
    padding:6px 30px;border-top:4px solid var(--c2);border-bottom:4px solid var(--c2);
  }

  /* ---- choreography ---- */
  .play .wrap{animation:slam var(--dur) cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes slam{
    0%{opacity:0;transform:translate(-50%,-50%) scale(3.2) rotate(-6deg)}
    9%{opacity:1;transform:translate(-50%,-50%) scale(.92) rotate(1deg)}
    12%{transform:translate(-50%,-50%) scale(1.06) rotate(-.5deg)}
    15%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-54%) scale(1.08)}
  }
  /* metallic shine sweep, clipped to the glyphs */
  .mult .shine{
    position:absolute;inset:0;color:transparent;filter:none;
    background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%);
    background-size:300% 100%;background-position:120% 0;
    -webkit-background-clip:text;background-clip:text;opacity:0;
  }
  .play .mult .shine{animation:shine var(--dur) ease-out forwards}
  @keyframes shine{0%,16%{opacity:0;background-position:120% 0}20%{opacity:1}48%{opacity:1;background-position:-120% 0}52%,100%{opacity:0}}

  /* ---- test control: only when ?test=1 ---- */
  #panel{position:fixed;left:16px;bottom:16px;display:none;gap:10px;pointer-events:auto;font-family:system-ui,sans-serif}
  #panel button{font:600 15px system-ui;padding:12px 18px;border:0;border-radius:10px;background:#fff;color:#111;cursor:pointer}
  #panel span{color:#fff;font-size:13px;opacity:.7;align-self:center;text-shadow:0 1px 2px #000}
  body.test #panel{display:flex}
  #dot{position:fixed;right:10px;bottom:10px;width:10px;height:10px;border-radius:50%;display:none;background:#e33}
  #dot.on{background:#3c3}
  body.test #dot{display:block}
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div class="wrap">
    <div class="mult"><span class="x">X</span><span id="num">3</span><span class="shine" aria-hidden="true"><span class="x">X</span><span id="num2">3</span></span></div>
    <div class="name" id="name">YAYINCI</div>
  </div>
</div>
<div id="dot" class="off"></div>
<div id="panel">
  <button id="btn">Efekti oynat</button>
  <span>T tuşu da çalışır</span>
</div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var name = (q.get("name") || "YAYINCI").toUpperCase().slice(0,16);
  var mult = (q.get("mult") || "3").replace(/[^0-9]/g,"") || "3";
  var theme = q.get("theme") || "gold";
  var dur = 3500;

  document.getElementById("name").textContent = name;
  document.getElementById("num").textContent = mult;
  document.getElementById("num2").textContent = mult;
  if (theme === "neon" || theme === "ice") document.body.classList.add("theme-" + theme);
  var hashTest = /test/.test(location.hash);
  if (q.get("test") === "1" || hashTest) document.body.classList.add("test");

  // ---- scale stage to viewport (Studio can hand us any size) ----
  var stage = document.getElementById("stage");
  function fit(){
    var s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();

  // ---- particles: 2D canvas, no WebGL ----
  var cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  var cs = getComputedStyle(document.body);
  function col(v){ return cs.getPropertyValue(v).trim(); }
  var parts = [], ring = null, t0 = 0, raf = 0;
  var W = 1080, H = 1920, CX = 540, CY = 1150; // CY ≈ 60% (PK-safe, below the face)

  function burst(){
    var c1 = col("--c1"), c2 = col("--c2"), c3 = col("--c3");
    parts = [];
    for (var i = 0; i < 160; i++){
      var a = Math.random()*Math.PI*2, sp = 6 + Math.random()*16;
      parts.push({x:CX, y:CY, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 6,
        r: 3 + Math.random()*7, life: 1, decay: .006 + Math.random()*.012,
        c: [c1,c2,c3][i%3], spin: Math.random()*6, spark: i%4===0});
    }
    // slow rising embers for the hold phase
    for (var j = 0; j < 90; j++){
      parts.push({x:CX + (Math.random()-.5)*620, y:CY + 200 + Math.random()*260,
        vx:(Math.random()-.5)*.8, vy:-(1.2+Math.random()*2.2), r:2+Math.random()*4,
        life:1, decay:.004+Math.random()*.006, c:[c1,c2][j%2], ember:true, delay: 300+Math.random()*1400});
    }
    ring = {r:40, a:1};
  }

  function draw(now){
    var el = now - t0;
    ctx.clearRect(0,0,W,H);
    // shock ring
    if (ring && ring.a > 0){
      ctx.beginPath(); ctx.arc(CX, CY, ring.r, 0, Math.PI*2);
      ctx.strokeStyle = col("--c2"); ctx.globalAlpha = ring.a*.8; ctx.lineWidth = 14*ring.a; ctx.stroke();
      ring.r += 26; ring.a -= .035; ctx.globalAlpha = 1;
    }
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      if (p.ember && el < p.delay) continue;
      p.x += p.vx; p.y += p.vy;
      if (!p.ember){ p.vy += .32; p.vx *= .985; }
      p.life -= p.decay; if (p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.c;
      if (p.spark){
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin + el*.01);
        ctx.fillRect(-p.r*1.6, -p.r*.25, p.r*3.2, p.r*.5);
        ctx.fillRect(-p.r*.25, -p.r*1.6, p.r*.5, p.r*3.2);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (el < dur) raf = requestAnimationFrame(draw); else { ctx.clearRect(0,0,W,H); parts = []; ring = null; }
  }

  var playing = false;
  function setTheme(th){
    document.body.classList.remove("theme-neon","theme-ice");
    if (th === "neon" || th === "ice") document.body.classList.add("theme-" + th);
  }
  function play(opts){
    opts = opts || {};
    if (opts.mult){ document.getElementById("num").textContent = opts.mult; document.getElementById("num2").textContent = opts.mult; }
    if (opts.theme) setTheme(opts.theme);
    if (opts.name) document.getElementById("name").textContent = opts.name.toUpperCase().slice(0,16);
    if (playing) return; playing = true;
    cs = getComputedStyle(document.body);
    document.body.classList.remove("play"); void document.body.offsetWidth;
    document.body.classList.add("play");
    t0 = performance.now(); burst(); cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
    setTimeout(function(){ document.body.classList.remove("play"); playing = false; }, dur + 50);
  }
  document.getElementById("btn").addEventListener("click", function(){ play(); });
  addEventListener("keydown", function(e){ if ((e.key||"").toLowerCase() === "t") play(); });
  window.playEffect = play;
  if (q.get("auto") === "1" || hashTest) setTimeout(function(){ play(); }, 900);

  // ---- canlı bağlantı: panelden gelen komutları dinle ----
  var key = (q.get("key") || "").toLowerCase();
  var dot = document.getElementById("dot");
  function connect(){
    if (!key) return;
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    var ws = new WebSocket(proto + location.host + "/ws?key=" + encodeURIComponent(key) + "&role=overlay");
    ws.onopen = function(){ dot.className = "on"; };
    ws.onmessage = function(ev){
      var m; try { m = JSON.parse(ev.data); } catch(e){ return; }
      if (m.type === "play") play({ mult: m.mult, theme: m.theme, name: m.name || name });
    };
    ws.onclose = function(){ dot.className = "off"; setTimeout(connect, 2000); };
    ws.onerror = function(){ try { ws.close(); } catch(e){} };
  }
  connect();
  // uzun yayında tarayıcı donarsa diye: 3 saatte bir sessiz tazeleme
  setTimeout(function(){ location.reload(); }, 3*60*60*1000);
})();
</script>
</body>
</html>
